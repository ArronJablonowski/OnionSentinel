services:
  postgres:
    # n8n's internal runtime DB needs higher write concurrency than SQLite can
    # reliably provide under relay webhook bursts. This database is for n8n
    # metadata/execution state only; alert-store remains the SOC alert source.
    image: postgres@sha256:e53683f43dd931aeacaef349422caf1f6259389ca5eab0c11763fcb8d38f26af
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${N8N_POSTGRES_DB:-n8n}
      - POSTGRES_USER=${N8N_POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${N8N_POSTGRES_PASSWORD:-replace-with-n8n-postgres-password}
    volumes:
      - ./n8n_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_POSTGRES_USER:-n8n} -d ${N8N_POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 10

  alert-store:
    # Docker-network compatibility proxy only. The real alert-store runs as a
    # Mac launchd service so SQLite writes stay off Docker Desktop bind mounts.
    image: n8nio/n8n@sha256:d136339f394dbe7f5a8cb87c2882348c0fc0a404edc0380ba03f1d2664bc0a97
    container_name: alert-store
    restart: unless-stopped
    working_dir: /app
    environment:
      - ALERT_STORE_PROXY_PORT=8787
      - ALERT_STORE_HOST_TARGET=host.docker.internal
      - ALERT_STORE_PORT_TARGET=8787
    volumes:
      - ./alert_store:/app:ro
    entrypoint: ["node", "/app/alert_store_proxy.js"]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

  n8n:
    # n8n hosts the webhook workflow and forwards accepted alerts to alert-store
    # over the Docker-internal service name.
    image: n8nio/n8n@sha256:d136339f394dbe7f5a8cb87c2882348c0fc0a404edc0380ba03f1d2664bc0a97
    container_name: n8n
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - TZ=America/Denver
      # Local HTTP deployment; do not expose this service directly to the Internet.
      - N8N_SECURE_COOKIE=false
      # n8n internal metadata and execution history use PostgreSQL for reliable
      # webhook concurrency. This is separate from alert-store's SQLite DB.
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${N8N_POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${N8N_POSTGRES_PASSWORD:-replace-with-n8n-postgres-password}
      # Keep bounded execution history in Postgres for operational debugging.
      # The row-count cap prevents unbounded growth during alert bursts.
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=${EXECUTIONS_DATA_SAVE_ON_SUCCESS:-all}
      - EXECUTIONS_DATA_SAVE_ON_ERROR=${EXECUTIONS_DATA_SAVE_ON_ERROR:-all}
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=${EXECUTIONS_DATA_SAVE_ON_PROGRESS:-false}
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=${EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS:-false}
      - EXECUTIONS_DATA_PRUNE=${EXECUTIONS_DATA_PRUNE:-true}
      - EXECUTIONS_DATA_MAX_AGE=${EXECUTIONS_DATA_MAX_AGE:-168}
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=${EXECUTIONS_DATA_PRUNE_MAX_COUNT:-5000}
      # The workflow uses http/url for alert-store and fs/path to render
      # Obsidian-compatible Markdown reports into /soc-alerts.
      - NODE_FUNCTION_ALLOW_BUILTIN=http,https,url,fs,path
    volumes:
      - ./n8n_data:/home/node/.n8n
      # Keep Docker's bind mount inside n8n-local. The user-facing
      # ~/Documents/SOC Alerts path should be a symlink to this directory so
      # Hermes and Obsidian see the reports without Docker needing a protected
      # Documents-folder mount.
      - ./soc-alerts:/soc-alerts
