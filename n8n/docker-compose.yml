services:
  postgres:
    # n8n's internal runtime DB needs higher write concurrency than SQLite can
    # reliably provide under relay webhook bursts. This database is for n8n
    # metadata/execution state only; alert-store remains the SOC alert source.
    image: postgres:16-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${N8N_POSTGRES_DB:-n8n}
      - POSTGRES_USER=${N8N_POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${N8N_POSTGRES_PASSWORD:-replace-with-n8n-postgres-password}
    volumes:
      - ./n8n_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_POSTGRES_USER:-n8n} -d ${N8N_POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 10

  alert-store:
    # Uses the n8n image so sqlite3 is already available; alert-store itself is
    # the Node script mounted at /app/alert_store.js.
    image: n8nio/n8n:latest
    container_name: alert-store
    restart: unless-stopped
    working_dir: /app
    environment:
      # The real Telegram token comes from .env, not from this repo.
      - ALERT_STORE_DB=/data/alerts.sqlite3
      - ALERT_STORE_BEACON_PATHS=/data/n8n-beacon.json,/portal/n8n-beacon.json
      - ALERT_STORE_PORT=8787
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_ALERT_LEVELS=${TELEGRAM_ALERT_LEVELS:-critical,high}
      - TELEGRAM_COOLDOWN_SECONDS=${TELEGRAM_COOLDOWN_SECONDS:-900}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - GREYNOISE_API_KEY=${GREYNOISE_API_KEY:-}
      - OTX_API_KEY=${OTX_API_KEY:-}
      - URLHAUS_AUTH_KEY=${URLHAUS_AUTH_KEY:-}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - URLSCAN_API_KEY=${URLSCAN_API_KEY:-}
      - GOOGLE_SAFE_BROWSING_API_KEY=${GOOGLE_SAFE_BROWSING_API_KEY:-}
      - PHISHTANK_API_KEY=${PHISHTANK_API_KEY:-}
      - MALWAREBAZAAR_AUTH_KEY=${MALWAREBAZAAR_AUTH_KEY:-}
      - THREATFOX_AUTH_KEY=${THREATFOX_AUTH_KEY:-}
      - SHODAN_API_KEY=${SHODAN_API_KEY:-}
      - CENSYS_API_ID=${CENSYS_API_ID:-}
      - CENSYS_API_SECRET=${CENSYS_API_SECRET:-}
      - CENSYS_API_TOKEN=${CENSYS_API_TOKEN:-}
      - CENSYS_ORGANIZATION_ID=${CENSYS_ORGANIZATION_ID:-}
      - NVD_API_KEY=${NVD_API_KEY:-}
      - ENRICHMENT_CACHE_TTL_SECONDS=${ENRICHMENT_CACHE_TTL_SECONDS:-86400}
      - ENRICHMENT_VULN_CACHE_TTL_SECONDS=${ENRICHMENT_VULN_CACHE_TTL_SECONDS:-86400}
      - ENRICHMENT_TIMEOUT_MS=${ENRICHMENT_TIMEOUT_MS:-5000}
      - VIRUSTOTAL_MINIMUM_LEVEL=${VIRUSTOTAL_MINIMUM_LEVEL:-high}
      - URLSCAN_SUBMIT_ENABLED=${URLSCAN_SUBMIT_ENABLED:-false}
      - ALERT_STORE_MAX_REQUEST_BYTES=${ALERT_STORE_MAX_REQUEST_BYTES:-10485760}
      - PCAP_ARTIFACT_DIR=/pcap-artifacts
      - PCAP_ARTIFACT_MAX_BYTES=${PCAP_ARTIFACT_MAX_BYTES:-7340032}
      - ALERT_STORE_SQLITE_BUSY_TIMEOUT_MS=${ALERT_STORE_SQLITE_BUSY_TIMEOUT_MS:-10000}
      - ALERT_STORE_SQLITE_JOURNAL_MODE=${ALERT_STORE_SQLITE_JOURNAL_MODE:-DELETE}
      - ALERT_STORE_SQLITE_SYNCHRONOUS=${ALERT_STORE_SQLITE_SYNCHRONOUS:-NORMAL}
      - ALERT_STORE_SQLITE_TEMP_STORE=${ALERT_STORE_SQLITE_TEMP_STORE:-DEFAULT}
      - PCAP_REQUEST_DEFAULT_WINDOW_SECONDS=${PCAP_REQUEST_DEFAULT_WINDOW_SECONDS:-120}
      - PCAP_REQUEST_MAX_WINDOW_SECONDS=${PCAP_REQUEST_MAX_WINDOW_SECONDS:-300}
    volumes:
      # Source code is read-only; SQLite data persists in alert_store_data.
      - ./alert_store:/app:ro
      - ./alert_store_data:/data
      - ./pcap-evidence/artifacts:/pcap-artifacts
      - ${SOC_ALERTS_PORTAL_DIR:-./portal}:/portal
    entrypoint: ["node", "/app/alert_store.js"]

  n8n:
    # n8n hosts the webhook workflow and forwards accepted alerts to alert-store
    # over the Docker-internal service name.
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - TZ=America/Denver
      # Local HTTP deployment; do not expose this service directly to the Internet.
      - N8N_SECURE_COOKIE=false
      # n8n internal metadata and execution history use PostgreSQL for reliable
      # webhook concurrency. This is separate from alert-store's SQLite DB.
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${N8N_POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${N8N_POSTGRES_PASSWORD:-replace-with-n8n-postgres-password}
      # Keep bounded execution history in Postgres for operational debugging.
      # The row-count cap prevents unbounded growth during alert bursts.
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=${EXECUTIONS_DATA_SAVE_ON_SUCCESS:-all}
      - EXECUTIONS_DATA_SAVE_ON_ERROR=${EXECUTIONS_DATA_SAVE_ON_ERROR:-all}
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=${EXECUTIONS_DATA_SAVE_ON_PROGRESS:-false}
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=${EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS:-false}
      - EXECUTIONS_DATA_PRUNE=${EXECUTIONS_DATA_PRUNE:-true}
      - EXECUTIONS_DATA_MAX_AGE=${EXECUTIONS_DATA_MAX_AGE:-168}
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=${EXECUTIONS_DATA_PRUNE_MAX_COUNT:-5000}
      # The workflow uses http/url for alert-store and fs/path to render
      # Obsidian-compatible Markdown reports into /soc-alerts.
      - NODE_FUNCTION_ALLOW_BUILTIN=http,https,url,fs,path
    volumes:
      - ./n8n_data:/home/node/.n8n
      # Keep Docker's bind mount inside n8n-local. The user-facing
      # ~/Documents/SOC Alerts path should be a symlink to this directory so
      # Hermes and Obsidian see the reports without Docker needing a protected
      # Documents-folder mount.
      - ./soc-alerts:/soc-alerts
